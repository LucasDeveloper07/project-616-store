<div id="esqueci-senha" class="d-flex align-items-center justify-content-center">
    <div class="card-esqueci-senha">

        <!--Titulo esqueci senha e texto-->
        <div class="texto-esqueci-senha">
            <h1 class="titulo-esqueci-senha">Esqueceu sua senha?</h1>
            <p class="paragrafo-esqueci-senha">
                Digite seu e-mail e enviaremos um link
                para redefinir sua senha.
            </p>
        </div>
    
        <!--Formulário esqueci senha-->
        <div class="esqueci-senha-form">
            <form action="" class="d-flex flex-column">
                <label for="email" class="label-email">E-mail:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
                <input type="submit" id="btn-enviar" value="Enviar link">
            </form>
        </div>
    
        <!--Link para tela de login-->
        <div class="link-login">
            <a href="login">
                <i class="bi bi-arrow-left"></i>
                Voltar para login
            </a>
        </div>
    </div>
</div>
