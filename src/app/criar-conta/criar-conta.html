<div class="auth-container">
  <!-- Lado Esquerdo: Formulário -->
  <div class="auth-form-side">
    <div class="form-wrapper">
      <h2 class="title-create-account">Criar sua conta</h2>
      <p class="subtitle">Faça parte do universo 616 e tenha acesso ao melhor do MCU!</p>

      <form>
        <div class="input-field">
          <i class="bi bi-person"></i>
          <input type="text" placeholder="Nome completo" required>
        </div>

        <div class="input-field">
          <i class="bi bi-envelope"></i>
          <input type="email" placeholder="E-mail" required>
        </div>

        <div class="input-field">
          <i class="bi bi-pencil"></i>
          <input type="tel" placeholder="Celular (opcional)">
        </div>

        <div class="input-field">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Senha" required>
        </div>

        <div class="input-field">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Confirmar senha" required>
        </div>

        <div class="terms-check">
          <input type="checkbox" id="terms" required>
          <label for="terms">Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#" class="highlight">Política de Privacidade</a>.</label>
        </div>

        <button type="submit" class="btn-submit">Cadastrar</button>
      </form>

      <p class="footer-link">Já tem uma conta? <a href="login">Faça login</a></p>
    </div>
  </div>

  <!-- Lado Direito: Banner Iron Man -->
  <div class="auth-banner-side ironman-bg">
    <div class="banner-overlay">
      <h1 class="banner-title">
        MAIS QUE PRODUTOS,<br>
        É O UNIVERSO MARVEL<br>
        EM SUAS MÃOS.
      </h1>
      <img src="logotipo-616.svg" alt="logotipo-616" class="mcu-tag">
    </div>
  </div>
</div>
