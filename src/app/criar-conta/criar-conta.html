<div class="auth-container">
  <!-- Lado Esquerdo: Formulário -->
  <div class="auth-form-side">
    <div class="form-wrapper">
      <h2 class="title-create-account">Criar sua conta</h2>
      <p class="subtitle">Faça parte do universo 616 e tenha acesso ao melhor do MCU!</p>

      <form ngNativeValidate (ngSubmit)="cadastrar()">
        <div class="input-field">
          <i class="bi bi-person"></i>
          <input type="text" name="nome" placeholder="Nome completo" required [(ngModel)]="cliente.nome">
        </div>

        <div class="input-field">
          <i class="bi bi-envelope"></i>
          <input type="email" name="email" placeholder="E-mail" required [(ngModel)]="cliente.email">
        </div>

        <div class="input-field">
          <i class="bi bi-pencil"></i>
          <input type="tel" name="telefone" placeholder="Celular (opcional)" [(ngModel)]="cliente.telefone">
        </div>

        <div class="input-field">
          <i class="bi bi-geo-alt"></i>
          <input type="text" name="logradouro" placeholder="Endereço de entrega" required [(ngModel)]="cliente.logradouro">
        </div>

        <div class="input-field">
          <i class="bi bi-lock"></i>
          <input type="password" name="senha" placeholder="Senha" required [(ngModel)]="cliente.senha">
        </div>

        <div class="input-field">
          <i class="bi bi-lock"></i>
          <input type="password" name="confirmarSenha" placeholder="Confirmar senha" required [(ngModel)]="confirmarSenha">
        </div>

        <div class="terms-check">
          <input type="checkbox" id="terms" required>
          <label for="terms">Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#" class="highlight">Política de Privacidade</a>.</label>
        </div>

        <p *ngIf="mensagem" [style.color]="tipoMensagem == 'erro' ? '#dc3545' : '#198754'" style="font-size: 14px; margin: 0 0 12px;">{{ mensagem }}</p>

        <button type="submit" class="btn-submit">Cadastrar</button>
      </form>

      <p class="footer-link">Já tem uma conta? <a href="login">Faça login</a></p>
    </div>
  </div>

  <!-- Lado Direito: Banner Iron Man -->
  <div class="auth-banner-side ironman-bg">
    <div class="banner-overlay">
      <h1 class="banner-title">
        MAIS QUE PRODUTOS,<br>
        É O UNIVERSO MARVEL<br>
        EM SUAS MÃOS.
      </h1>
      <img src="logotipo-616.svg" alt="logotipo-616" class="mcu-tag">
    </div>
  </div>
</div>
