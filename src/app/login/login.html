<div class="auth-container">
  <!-- Lado Esquerdo: Formulário -->
  <div class="auth-form-side">
    <div class="form-wrapper">
      <h2>Bem-vindo de volta!</h2>
      <p class="subtitle">Faça seu login para continuar explorando o universo 616.</p>

      <form ngNativeValidate (ngSubmit)="entrar()">
        <div class="input-field">
          <i class="bi bi-envelope"></i>
          <input type="text" name="email" placeholder="E-mail ou usuário" required [(ngModel)]="email">
        </div>

        <div class="input-field">
          <i class="bi bi-lock"></i>
          <input [type]="mostrarSenha ? 'text' : 'password'" name="senha" class="campo-senha" placeholder="Senha" required [(ngModel)]="senha">

          <!--Botão mostrar/ocultar senha-->
          <button type="button" class="btn-olho" (click)="mostrarSenha = !mostrarSenha"
                  [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
            <i class="bi" [class.bi-eye]="!mostrarSenha" [class.bi-eye-slash]="mostrarSenha"></i>
          </button>
        </div>

        <div class="options-row">
          <label><input type="checkbox"> Lembrar de mim</label>
          <a href="esqueci-senha" class="forgot-pass">Esqueci minha senha</a>
        </div>

        <p *ngIf="mensagem" style="color:#dc3545;font-size:14px;margin:0 0 12px">{{mensagem}}</p>

        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <div class="divider">ou</div>

      <button class="btn-social google"><i class="bi bi-google"></i> Continuar com Google</button>
      <button class="btn-social facebook"><i class="bi bi-facebook"></i> Continuar com Facebook</button>

      <p class="footer-link">Não tem uma conta? <a href="criar-conta">Cadastre-se</a></p>
    </div>
  </div>

  <!-- Lado Direito: Banner Spider-Man -->
  <div class="auth-banner-side spiderman-bg">
    <div class="banner-overlay">
      <h1 class="banner-title">
        HERÓIS,<br>
        VILÕES,<br>
        COLECIONÁVEIS<br>
        E MUITO MAIS.
      </h1>
      <img src="logotipo-616.svg" alt="logotipo-616" class="mcu-tag">
    </div>
  </div>
</div>
